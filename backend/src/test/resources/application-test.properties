# Test profile — safe defaults only. Real OAuth/S3 secrets never go here.
spring.application.name=ambi

# Local Docker Mongo/Redis (see repo-root compose.yaml). @SpringBootTest context
# tests connect to these; slice tests (@WebMvcTest) do not touch them.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://root:secret@localhost:27017/ambi_test?authSource=admin}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:password}

# Don't let spring-boot-docker-compose try to boot containers during tests.
spring.docker.compose.enabled=false

# OAuth2 client registrations are Phase 2; leaving them empty here keeps the
# OAuth2 login auto-config inactive and our SecurityConfig entry point in force.

# Fixed, test-only signing key (>=32 bytes for HS256).
ambi.auth.token.signing-key=test-only-signing-key-at-least-32-bytes-long-xyz
ambi.auth.cors.frontend-origin=http://localhost:5173
