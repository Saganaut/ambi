# Test profile — safe defaults only. Real OAuth/S3 secrets never go here.
spring.application.name=ambi

# Local Docker Mongo/Redis (see repo-root compose.yaml). @SpringBootTest context
# tests connect to these; slice tests (@WebMvcTest) do not touch them.
# Prefix is spring.mongodb in Spring Boot 4 (was spring.data.mongodb); the old
# key binds nothing and falls back to an unauthenticated mongodb://localhost/test.
spring.mongodb.uri=${MONGO_URI:mongodb://root:secret@localhost:27017/ambi_test?authSource=admin}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:password}

# Don't let spring-boot-docker-compose try to boot containers during tests.
spring.docker.compose.enabled=false

# Cache abstraction is a NoOp under @SpringBootTest by default, so @Cacheable/
# @CacheEvict become pass-throughs and can't introduce stale-read flakiness.
# Tests that specifically exercise caching (UserServiceCacheTest) opt back in
# with spring.cache.type=redis via @SpringBootTest(properties=...).
spring.cache.type=none

# Dummy OAuth client registrations: SecurityConfig wires .oauth2Login() in the
# non-test profile, but the registration repository is shared with auto-config.
# Concrete values are unused under TestSecurityConfig (permit-all, no OAuth
# chain). Discord/Microsoft are custom providers (not in CommonOAuth2Provider),
# so their provider endpoint blocks must bind here too or autoconfig fails.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.discord.client-id=test-client-id
spring.security.oauth2.client.registration.discord.client-secret=test-client-secret
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

spring.security.oauth2.client.registration.microsoft.client-id=test-client-id
spring.security.oauth2.client.registration.microsoft.client-secret=test-client-secret
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# Fixed, test-only signing key (>=32 bytes for HS256).
ambi.auth.token.signing-key=test-only-signing-key-at-least-32-bytes-long-xyz
ambi.auth.cors.frontend-origin=http://localhost:5173

# Dummy S3 creds so the S3Client bean builds in @SpringBootTest contexts. The
# client never connects at startup, so tests that don't exercise upload/serve
# never reach Garage; these are placeholders, not real keys.
# Fixed, test-only HMAC secret for the opaque image proxy (>=32 chars), for the
# same reason as the signing key above: a context must not depend on the
# insecure dev fallback in application.properties.
ambi.media.opaque-token-secret=test-only-opaque-image-secret-at-least-32-chars

# Same reasoning for the worker callback secret (>= 32 chars); a context must not
# depend on the insecure dev fallback. Enqueueing is off so a @SpringBootTest
# never reaches for a queue — pending rows are still written either way.
ambi.media.variants.callback-secret=test-only-worker-callback-secret-at-least-32-chars
ambi.media.variants.enabled=false

ambi.s3.endpoint=http://localhost:3900
ambi.s3.bucket=ambi-images-test
ambi.s3.access-key=test-access-key
ambi.s3.secret-key=test-secret-key

# Same reasoning for the queue client: static placeholder credentials so the
# SqsClient bean builds without reaching for an IAM role, and an endpoint that
# is never contacted (enqueueing is off above, and the client connects lazily).
ambi.sqs.endpoint=http://localhost:9324
ambi.sqs.region=elasticmq
ambi.sqs.access-key=test-access-key
ambi.sqs.secret-key=test-secret-key
ambi.sqs.image-variant-queue-url=http://localhost:9324/000000000000/ambi-image-variants
