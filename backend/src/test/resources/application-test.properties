# Test profile — safe defaults only. Real OAuth/S3 secrets never go here.
spring.application.name=ambi

# Local Docker Mongo/Redis (see repo-root compose.yaml). @SpringBootTest context
# tests connect to these; slice tests (@WebMvcTest) do not touch them.
# Prefix is spring.mongodb in Spring Boot 4 (was spring.data.mongodb); the old
# key binds nothing and falls back to an unauthenticated mongodb://localhost/test.
spring.mongodb.uri=${MONGO_URI:mongodb://root:secret@localhost:27017/ambi_test?authSource=admin}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:password}

# Don't let spring-boot-docker-compose try to boot containers during tests.
spring.docker.compose.enabled=false

# Dummy OAuth client registration: SecurityConfig wires .oauth2Login() in the
# non-test profile, but the registration repository is shared with auto-config.
# Concrete values are unused under TestSecurityConfig (permit-all, no OAuth chain).
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Fixed, test-only signing key (>=32 bytes for HS256).
ambi.auth.token.signing-key=test-only-signing-key-at-least-32-bytes-long-xyz
ambi.auth.cors.frontend-origin=http://localhost:5173

# Dummy S3 creds so the S3Client bean builds in @SpringBootTest contexts. The
# client never connects at startup, so tests that don't exercise upload/serve
# never reach Garage; these are placeholders, not real keys.
ambi.s3.endpoint=http://localhost:3900
ambi.s3.bucket=ambi-images-test
ambi.s3.access-key=test-access-key
ambi.s3.secret-key=test-secret-key
