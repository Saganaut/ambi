spring.application.name=ambi

# ── Active profile: driven by ENV (dev.env sets ENV=DEV; prod sets ENV=PROD).
# Default DEV keeps local runs unchanged. Tests override via @ActiveProfiles("test").
spring.profiles.active=${ENV:DEV}

# ── MongoDB ──────────────────────────────────────────────────────────────────
# Defaults target the repo-root compose.yaml (mongo root/secret on :27017).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://root:secret@localhost:27017/ambi?authSource=admin}

# ── Redis (session source of truth — see auth/README.md) ─────────────────────
# Defaults target the repo-root compose.yaml (redis --requirepass password).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:password}

# ── Error disclosure hardening (EXCEPTION-RULES) ─────────────────────────────
# Never leak framework messages/stack traces; GlobalExceptionHandler owns bodies.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# ── OAuth2 client: Google ────────────────────────────────────────────────────
# Real credentials must be supplied via env (dev.env / prod secret store). The
# dummy defaults let the app boot and the chain wire up; an actual OAuth round
# trip will fail at Google until real credentials are provided. Our explicit
# .oauth2Login() success handler in SecurityConfig owns the post-OAuth flow;
# the AuthenticationEntryPoint stays our handlerExceptionResolver-based one.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── Auth (bound by AuthProperties) ───────────────────────────────────────────
# Cookie names/TTLs are the README defaults; secure flag is derived per-request.
ambi.auth.cookie.access-name=AMBI_AT
ambi.auth.cookie.refresh-name=AMBI_RT
ambi.auth.cookie.same-site=Lax
ambi.auth.cookie.path=/
# Signing key: MUST be overridden in production. Dev default is intentionally
# insecure and >=32 bytes (HS256). No dotenv loader exists in this repo.
ambi.auth.token.signing-key=${AMBI_JWT_SIGNING_KEY:dev-only-insecure-signing-key-change-me-please-32b}
ambi.auth.token.issuer=ambi
ambi.auth.token.access-ttl=PT15M
ambi.auth.token.refresh-idle-ttl=PT30M
ambi.auth.token.refresh-persistent-ttl=P30D
ambi.auth.session.redis-namespace=ambi:userSession
ambi.auth.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
