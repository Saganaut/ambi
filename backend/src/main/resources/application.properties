spring.application.name=ambi

# ── Docker Compose lifecycle ─────────────────────────────────────────────────
# Disabled: infra is owned by the repo-root compose.yaml via scripts/ambi.sh.
# Left enabled, spring-boot-docker-compose would auto-start backend/compose.yaml
# as a separate "backend" project, duplicating the ambi-* stack and clashing on
# ports (e.g. 6379).
spring.docker.compose.enabled=false

# ── Active profile: driven by ENV (dev.env sets ENV=DEV; prod sets ENV=PROD).
# Default DEV keeps local runs unchanged. Tests override via @ActiveProfiles("test").
spring.profiles.active=${ENV:DEV}

# ── MongoDB ──────────────────────────────────────────────────────────────────
# Defaults target the repo-root compose.yaml (mongo root/secret on :27017).
# Prefix is spring.mongodb (NOT spring.data.mongodb) — Spring Boot 4 moved MongoDB
# autoconfig to its own module and renamed the prefix. The old key binds nothing,
# silently falling back to mongodb://localhost/test with no auth.
spring.mongodb.uri=${MONGO_URI:mongodb://root:secret@localhost:27017/ambi?authSource=admin}

# ── Redis (session source of truth — see auth/README.md) ─────────────────────
# Defaults target the repo-root compose.yaml (redis --requirepass password).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:password}

# ── Error disclosure hardening (EXCEPTION-RULES) ─────────────────────────────
# Never leak framework messages/stack traces; GlobalExceptionHandler owns bodies.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# ── OAuth2 clients: Google / Discord / Microsoft ─────────────────────────────
# Real credentials must be supplied via env (dev.env / prod secret store — see
# example.env for per-provider app setup). The dummy defaults let the app boot
# and the chain wire up; an actual OAuth round trip will fail at the provider
# until real credentials are provided. Our explicit .oauth2Login() success
# handler in SecurityConfig owns the post-OAuth flow; the
# AuthenticationEntryPoint stays our handlerExceptionResolver-based one.

# Google: endpoints come from Spring's built-in CommonOAuth2Provider.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Discord: plain OAuth2, not OIDC (no discovery document, no openid scope) —
# identity comes from the users/@me endpoint, keyed by the immutable
# snowflake "id". Not in CommonOAuth2Provider, so grant type, redirect
# template, and every endpoint are spelled out.
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Microsoft: OIDC via the /common multi-tenant endpoint (personal + org
# accounts). issuer-uri is deliberately OMITTED: /common's discovery document
# advertises the templated issuer https://login.microsoftonline.com/{tenantid}/v2.0,
# but each real ID token carries its tenant-specific issuer, so Spring's
# OidcIdTokenValidator (which string-compares iss against the configured
# issuer-uri) would reject every login. Explicit endpoints + jwk-set-uri keep
# full signature/audience/expiry validation and skip only the issuer equality
# check.
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# ── Auth (bound by AuthProperties) ───────────────────────────────────────────
# Cookie names/TTLs are the README defaults; secure flag is derived per-request.
ambi.auth.cookie.access-name=AMBI_AT
ambi.auth.cookie.refresh-name=AMBI_RT
ambi.auth.cookie.same-site=Lax
ambi.auth.cookie.path=/
# Signing key: MUST be overridden in production. Dev default is intentionally
# insecure and >=32 bytes (HS256). No dotenv loader exists in this repo.
ambi.auth.token.signing-key=${AMBI_JWT_SIGNING_KEY:dev-only-insecure-signing-key-change-me-please-32b}
ambi.auth.token.issuer=ambi
ambi.auth.token.access-ttl=PT15000M
ambi.auth.token.refresh-idle-ttl=PT300000M
ambi.auth.token.refresh-persistent-ttl=P30D
ambi.auth.session.redis-namespace=ambi:userSession
ambi.auth.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Guest TTL: Mongo TTL monitor reaps guest User docs after this duration. The
# field user.guestExpiresAt holds the actual expiry; cleared on guest→registered
# upgrade so a real account is never reaped.
ambi.auth.guest.ttl=P7D

# ── S3 / Garage object store (bound by S3Properties) ─────────────────────────
# Defaults target the repo-root compose.yaml Garage container. Credentials come
# from dev.env (run scripts/init-garage.sh once to mint them); left blank the
# client still builds — only the first put/get fails.
ambi.s3.endpoint=${S3_ENDPOINT:http://localhost:3900}
ambi.s3.region=${S3_REGION:garage}
ambi.s3.bucket=${S3_BUCKET:ambi-images}
ambi.s3.access-key=${S3_ACCESS_KEY:}
ambi.s3.secret-key=${S3_SECRET_KEY:}
ambi.s3.path-style-access=true

# ── Media serving / ingest (bound by MediaProperties) ────────────────────────
# Internal images are served via short-lived presigned S3 GET URLs (the bucket
# stays private); presign-ttl is how long each minted URL stays valid before a
# reload re-signs it. max-upload-bytes caps a single ingest.
ambi.media.presign-ttl=1h
ambi.media.max-upload-bytes=10485760

# Opaque image proxy (OpaqueImageUrls / OpaqueImageController): the images whose
# S3 key must not travel — a SPOT_THE_ANSWER follow-up board's candidates — are
# served from our own origin behind an HMAC-signed token instead of a presigned
# URL. The secret MUST be overridden in production (>= 32 chars); the TTL matches
# the 6h Redis round-snapshot TTL those URLs get frozen into. public-base-url is
# the origin the URLs are minted absolute against (the browser rendering them is
# on the frontend's origin); leave it blank to mint root-relative URLs when one
# origin fronts both halves.
ambi.media.opaque-token-secret=${AMBI_OPAQUE_IMAGE_SECRET:dev-only-insecure-opaque-image-secret-change-me}
ambi.media.opaque-token-ttl=6h
ambi.media.public-base-url=${AMBI_PUBLIC_BASE_URL:http://localhost:8080}

# Multipart limits must clear the ingest cap above (with headroom for the form
# envelope), else Spring rejects the request before our validation runs.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

