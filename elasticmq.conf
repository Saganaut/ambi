include classpath("application.conf")

// ElasticMQ stands in for SQS in dev (see z-docs/decisions/004-async-image-variants.md).
// Queues are declared here rather than created at runtime, so both the backend
// producer and the Python worker can address a fixed URL without a GetQueueUrl
// round trip. Mirrors garage.toml's repo-root placement — mounted read-only by
// the elasticmq service in compose.yaml.

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  ambi-image-variants {
    // Long enough for a cold worker to fetch, render five tiers and PUT them.
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ambi-image-variants-dlq"
      maxReceiveCount = 5
    }
  }
  ambi-image-variants-dlq { }
}
