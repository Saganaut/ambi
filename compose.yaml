services:
  mongodb:
    # Pinned to 7.0 (LTS): mongo:latest (8.x) segfaults during index builds on
    # this host's 6.x kernel (SIGSEGV / exit 139). 7.0 is stable here.
    image: "mongo:7.0"
    environment:
      - "MONGO_INITDB_DATABASE=ambi"
      - "MONGO_INITDB_ROOT_PASSWORD=secret"
      - "MONGO_INITDB_ROOT_USERNAME=root"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data
  redis:
    image: redis/redis-stack-server:latest
    container_name: ambi-redis
    ports:
      - "6379:6379"
    # environment:
    #   - REDIS_ARGS=--requirepass password
    command:
      ["redis-server", "--requirepass", "password", "--protected-mode", "no"]
    volumes:
      - redis-data:/data
  redisinsight:
    # The redis-stack-server image ships no UI, so the Redis admin UI is its own
    # service. RedisInsight listens on 5540 internally; published as 8001.
    image: redis/redisinsight:latest
    container_name: ambi-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight-data:/data
    restart: unless-stopped
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: ambi-garage
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
  elasticmq:
    # The dev stand-in for SQS behind the async image-variant pipeline (see
    # z-docs/decisions/004-async-image-variants.md). Queues — including the DLQ
    # and its redrive policy — are declared in elasticmq.conf, so neither the
    # backend producer nor the worker has to create them.
    image: softwaremill/elasticmq-native:1.6.11
    container_name: ambi-elasticmq
    ports:
      - "9324:9324" # SQS wire protocol
      - "9325:9325" # stats UI
    volumes:
      # `z` relabels the mounted config for container access — ElasticMQ runs as
      # a non-root user and reads it at startup, which an SELinux host (Fedora)
      # otherwise denies. Ignored where SELinux isn't enforcing.
      - ./elasticmq.conf:/opt/elasticmq.conf:ro,z
  image-variant-worker:
    # Renders the WebP tiers ingest no longer produces inline, then reports back
    # to POST /api/internal/image-variants. The backend runs on the HOST (see
    # scripts/ambi.sh), hence host.docker.internal for the callback; inside this
    # network Garage and ElasticMQ answer to their service names.
    build:
      context: ./worker
      target: poller
    container_name: ambi-image-variant-worker
    depends_on:
      - elasticmq
      - garage
    # The secrets — AMBI_WORKER_S3_ACCESS_KEY_ID, AMBI_WORKER_S3_SECRET_ACCESS_KEY
    # and AMBI_WORKER_CALLBACK_SECRET — come from dev.env (absent on a fresh
    # clone, hence required: false); everything below is fixed for compose and
    # wins over the file. env_file injects names verbatim, which is why dev.env
    # repeats the Garage key pair under the AMBI_WORKER_* names.
    env_file:
      - path: dev.env
        required: false
    environment:
      - AMBI_WORKER_SQS_ENDPOINT=http://elasticmq:9324
      - AMBI_WORKER_QUEUE_URL=http://elasticmq:9324/000000000000/ambi-image-variants
      - AMBI_WORKER_AWS_REGION=elasticmq
      - AWS_ACCESS_KEY_ID=x
      - AWS_SECRET_ACCESS_KEY=x
      - AMBI_WORKER_S3_ENDPOINT=http://garage:3900
      - AMBI_WORKER_S3_REGION=garage
      - AMBI_WORKER_S3_BUCKET=ambi-images
      - AMBI_WORKER_S3_PATH_STYLE=true
      - AMBI_WORKER_CALLBACK_URL=http://host.docker.internal:8080/api/internal/image-variants
      - AMBI_WORKER_LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  # LocalStack emulates AWS service APIs locally so the CloudWatch path can be
  # exercised in dev instead of only at deploy time (see
  # z-docs/decisions/001-observability-stack.md). Scoped to cloudwatch + logs —
  # the queue the async image pipeline uses is ElasticMQ above, which ships real
  # DLQ/redrive semantics and needs no Pro license. Garage stays the S3
  # implementation — LocalStack does NOT replace it. Point the AWS SDK at
  # http://localhost:4566 via AWS_ENDPOINT_URL in dev.env (omit in production).
  mongo-express:
    image: mongo-express:latest
    container_name: ambi-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secret
      - ME_CONFIG_MONGODB_URL=mongodb://root:secret@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    restart: unless-stopped
  localstack:
    # Pinned to 4.x (community): localstack/localstack:latest now resolves to a
    # build that hard-fails on startup without a LOCALSTACK_AUTH_TOKEN (Pro
    # license). 4.x community supports cloudwatch + logs with no token.
    image: localstack/localstack:4
    container_name: ambi-localstack
    ports:
      - "4566:4566" # edge port — all emulated AWS service APIs
    environment:
      - SERVICES=cloudwatch,logs
      - DEBUG=0
    volumes:
      - localstack-data:/var/lib/localstack
volumes:
  mongo-data:
  redis-data:
  redisinsight-data:
  garage-meta:
  garage-data:
  localstack-data:
